packages:
  - "apps/*"
  - "packages/*"

# pnpm only runs dependency install scripts that are listed here.
# esbuild's postinstall is optional: its binary comes from a platform-specific package.
allowBuilds:
  esbuild: false
  # msgpackr-extract (via bullmq) is an optional native speed-up; msgpackr falls back to plain JS.
  msgpackr-extract: false
