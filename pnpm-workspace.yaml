packages:
  - "apps/*"
  - "packages/*"

# pnpm only runs dependency install scripts that are listed here.
# esbuild's postinstall is optional: its binary comes from a platform-specific package.
allowBuilds:
  esbuild: false
  # msgpackr-extract (via bullmq) is an optional native speed-up; msgpackr falls back to plain JS.
  msgpackr-extract: false
  # via @huggingface/transformers (Task 2.1): the script only downloads GPU (CUDA) add-ons; the CPU runtime is bundled
  onnxruntime-node: false
  # its postinstall only checks the installed version
  protobufjs: false
  # the desktop app (Task 3.1): its install script downloads the Electron program for this computer
  # (CI sets ELECTRON_SKIP_BINARY_DOWNLOAD: lint and typecheck don't need it)
  electron: true
  # via electron-builder: picks the 7-Zip binary for Windows installers; we only build for macOS
  electron-winstaller: false
